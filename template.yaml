AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RiskDesk - operational risk incident register (FastAPI container on Lambda, DynamoDB)

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Required in the X-API-Key header on every incident endpoint.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional. When set, incidents are classified by Claude (paid). Empty means the free rules classifier.
  ClaudeModel:
    Type: String
    Default: claude-opus-5-5

Globals:
  Function:
    # Created by infra/bootstrap.yaml. Caps what the function role can ever be granted.
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/riskdesk-boundary

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # 1 read / 1 write unit sits inside DynamoDB's always-free 25 / 25.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref IncidentsTable
          API_KEY: !Ref ApiKey
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          CLAUDE_MODEL: !Ref ClaudeModel
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE

  # Public URL, so both grants are needed (AWS has required the second one for new
  # URLs since Oct 2025). The app itself enforces X-API-Key on incident endpoints.
  UrlInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref IncidentsTable
